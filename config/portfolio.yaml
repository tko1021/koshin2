# 代表ダッシュボード：経営ポートフォリオ設定
# ------------------------------------------------------------------
# ここは「代表が意思決定するためのデータ」です。個人情報は書きません。
# 数値スコアは 1〜5 の5段階。代表の肌感で編集してください（根拠はメモ欄へ）。
#   魅力度軸 attractiveness : 市場性 / 収益性 / ビジョン適合（やりたい度）
#   実現性軸 feasibility    : 自社の強み / リソース余力 / 着手容易性
# スコアを変えるとダッシュボードの「選択と集中マトリクス」が自動で動きます。
# ------------------------------------------------------------------

vision: >-
  代表ダッシュボードを中心に、既存事業（ドローンスクール）と新規アイデア（衣装アプリ）、
  そして日々のメモ・現状把握を一枚のプラットフォームへ統合する。
  すべての事業を「お互いに成功させる」ことを前提に、限られた時間と資源を
  どこへ集中するかを、数字と象限で見える化して意思決定する。

# 選択と集中の判定しきい値（3.0を境に高/低を分ける）
threshold: 3.0

ventures:
  - id: drone_school
    name: ドローンスクール（DIPS更新講習）
    icon: 🛩
    stage: 既存・稼働中
    role: キャッシュカウ（土台）
    summary: >-
      登録更新講習機関としての修了者管理・DIPS一括登録CSV・修了証明書発行。
      本プラットフォームの土台であり、安定収益と信用を生む中核事業。
    attractiveness:   # 市場性 / 収益性 / ビジョン適合
      市場性: 3
      収益性: 4
      ビジョン適合: 4
    feasibility:      # 自社の強み / リソース余力 / 着手容易性
      自社の強み: 5
      リソース余力: 4
      着手容易性: 5
    next_actions:
      - 更新講習の受講者導線を整え、修了→DIPS登録までの運用を標準化する
      - 既存の信用・顧客基盤を、新規事業の初期集客に転用できないか検討する
    kpis:
      - label: 登録修了者
        source: people_count   # ライブ値（Googleシートの修了者数）
      - label: 5営業日期限の超過
        source: overdue_count  # ライブ値（期限超過の件数）

  - id: costume_app
    name: 衣装アプリ（新規構想）
    icon: 👗
    stage: 構想・検証前
    role: 育成（次の柱の候補）
    summary: >-
      衣装（コスチューム／レンタル衣装／コスプレ等）の管理・マッチングを行うアプリ。
      詳細は「衣装アプリ構想」ページを参照。まずは小さく検証して筋の良さを確かめる。
    attractiveness:
      市場性: 4
      収益性: 3
      ビジョン適合: 5
    feasibility:
      自社の強み: 2
      リソース余力: 2
      着手容易性: 3
    next_actions:
      - ターゲットと課題を1文で言語化し、ヒアリング5件で仮説を検証する
      - MVPの最小機能だけに絞り、既存事業の合間で回せる規模に設計する
    kpis: []

# ここに事業を追加すれば、そのままマトリクスに載ります（id は一意に）。

# 衣装アプリの構想（「衣装アプリ構想」ページで表示）
costume_app:
  headline: 衣装を「探す・借りる・管理する」を一つに
  one_liner: >-
    衣装を持つ人／借りたい人をつなぎ、在庫と貸出をスマホで完結させるアプリ。
  problem:
    - 衣装の在庫・サイズ・貸出状況が紙やチャットで散らばり、探すのに時間がかかる
    - 単発の衣装ニーズ（イベント・撮影・舞台・コスプレ）に応える供給が見えにくい
    - 貸し手は遊休衣装を活かせず、借り手は近くの選択肢を見つけられない
  target:
    - 借りる側：イベント／撮影／舞台／コスプレで単発の衣装が要る個人・団体
    - 貸す側：衣装を多く持つ団体・個人・レンタル事業者
  value:
    - 検索：用途・サイズ・地域・日付で衣装をすぐ探せる
    - 貸出管理：在庫・予約・返却・料金を1画面で
    - マッチング：貸し手と借り手を地域単位でつなぐ
  monetization:
    - 貸出成約時の手数料（マッチング手数料）
    - 貸し手向けの在庫管理サブスク（月額）
    - 撮影・イベント事業者への広告／優先掲載
  mvp:
    - 衣装の登録（写真・サイズ・料金・空き状況）
    - 一覧・検索（用途／地域／日付）
    - 予約リクエストとメッセージ
    - まずは特定ジャンル1つ・特定地域1つに絞って検証
  synergy:
    - ドローンスクールの集客・運用ノウハウ（予約／本人確認／証明書発行）を転用できる
    - 本プラットフォームのアカウント・決済・通知基盤を共通化してコストを下げる
    - どちらもリピートを生むため、既存顧客への相互送客が期待できる
  risks:
    - 供給（貸し手）が集まらないと成立しない → 初期は貸し手開拓を優先
    - 在庫の状態・トラブル対応の運用負荷 → 対象ジャンルを絞って標準化
